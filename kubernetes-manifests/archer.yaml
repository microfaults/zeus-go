apiVersion: apps/v1
kind: Deployment
metadata:
  name: archer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archer
  template:
    metadata:
      labels:
        app: archer
    spec:
      containers:
        - name: archer
          image: archer
          ports:
            - containerPort: 8080
          env:
            - name: ARCHER_ADDR
              value: ":8080"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: archer
spec:
  selector:
    app: archer
  ports:
    - port: 8080
      targetPort: 8080
