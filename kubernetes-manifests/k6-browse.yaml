apiVersion: batch/v1
kind: Job
metadata:
  name: k6-browse
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-browse
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-zeus
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -qO- http://zeus:8080/api/v1/status >/dev/null 2>&1; do
                echo "waiting for zeus..."; sleep 2;
              done
      containers:
        - name: k6-browse
          image: k6-loadgen
          command: ["k6", "run", "/scripts/runner.js"]
          env:
            - name: ZEUS_URL
              value: "http://zeus:8080"
            - name: BASE_URL
              value: "http://frontend:80"
            - name: FLOW
              value: "online-boutique/browse"
            - name: PERSONA
              value: "cautious"
            - name: VUS
              value: "10"
            - name: DURATION
              value: "5m"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
