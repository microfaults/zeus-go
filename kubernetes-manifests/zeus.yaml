apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeus
  template:
    metadata:
      labels:
        app: zeus
    spec:
      containers:
        - name: zeus
          # SHA-pinned for provenance: maps the running container to a specific
          # zeus-go commit (= git tag v0.0.9). Built locally on VM2 (no registry),
          # so pull policy is IfNotPresent — never reach out to docker.io.
          image: zeus:ad2b8de
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ZEUS_ADDR
              value: ":8080"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zeus
spec:
  selector:
    app: zeus
  ports:
    - port: 8080
      targetPort: 8080
